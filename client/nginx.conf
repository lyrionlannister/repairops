server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Assets con hash en el nombre: cache largo, y 404 real si no existen
    # (si cayeran al fallback devolverian index.html como si fuera JS).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html y rutas del SPA: siempre revalidar, para que un deploy nuevo
    # no deje al navegador apuntando a un bundle viejo.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
