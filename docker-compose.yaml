services:
  postgres:
    build:
      context: ./infra/database
      dockerfile: Dockerfile
    container_name: repairops-postgres
    restart: unless-stopped
    env_file:
      - ./infra/database/.env
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql
      - ./infra/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    build:
      context: ./infra/redis
    container_name: repairops-redis
    restart: unless-stopped
    env_file:
      - ./infra/redis/.env
    ports:
      - "${REDIS_PORT:?REDIS_PORT is required}:6379"
    volumes:
      - redis_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user $$REDIS_USER --pass $$REDIS_PASSWORD --no-auth-warning ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  automation:
    build:
      context: ./automation
      dockerfile: Dockerfile
    image: repairops-automation
    container_name: repairops-automation
    restart: unless-stopped
    env_file:
      - ./automation/.env
    ports:
      - "${N8N_PORT:?N8N_PORT is required}:${N8N_PORT:?N8N_PORT is required}"
    volumes:
      - automation_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: repairops-api
    restart: unless-stopped
    env_file:
      - ./api/.env
    environment:
      NODE_ENV: production
    ports:
      - "${APP_PORT:?APP_PORT is required}:${APP_CONTAINER_PORT:?APP_CONTAINER_PORT is required}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      automation:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: repairops-client
    container_name: repairops-client
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  nginx:
    image: docker.io/library/nginx:alpine
    container_name: repairops-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy
      automation:
        condition: service_healthy
      client:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  certbot:
    image: docker.io/certbot/dns-cloudflare:latest
    container_name: repairops-certbot
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - ./infra/SSL/cloudflare.ini:/etc/letsencrypt/cloudflare.ini:ro
    # DNS-01: no necesita puerto 80 abierto ni pasar por el tunel. Solo
    # renueva: el alta inicial del cert se corre a mano (ver infra/SSL/README.md).
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'

  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: repairops-cloudflared
    env_file:
      - ./infra/cloudflared/.env
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
  postgres18_data:
  postgres_prod_data:
  redis_data:
  automation_data:
  certbot_certs:
