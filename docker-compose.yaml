services:
  nginx:
    image: docker.io/library/nginx:alpine
    container_name: repairops-nginx
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - n8n
      - client

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
    image: repairops-client
    container_name: repairops-client

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: repairops-api
    env_file:
      - ./api/.env
    environment:
      # Siempre production en el contenedor -- este corre dist/ compilado, no
      # src/ con ts-node. env_file no trae NODE_ENV a propósito; si lo
      # trajera y pisara este ENV NODE_ENV=production del Dockerfile,
      # migration-data-source.ts buscaría migraciones en src/*.ts (que no
      # existe en la imagen runtime), encontraría cero, y el boot truena en el seed.
      NODE_ENV: production
    ports:
      - "${APP_PORT:?APP_PORT is required}:${APP_CONTAINER_PORT:?APP_CONTAINER_PORT is required}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_started

  n8n:
    build:
      context: ./n8n
      dockerfile: Dockerfile
    image: repairops-n8n
    container_name: repairops-n8n
    env_file:
      - ./n8n/.env
    ports:
      - "${N8N_PORT:?N8N_PORT is required}:${N8N_PORT:?N8N_PORT is required}"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: repairops-postgres
    env_file:
      - ./database/.env
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ (no ${...}) -- se resuelve en el shell DEL CONTENEDOR via env_file,
      # no en la sustitucion de Compose (que no tiene por que conocer POSTGRES_USER).
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    build:
      context: ./database/redis
    container_name: repairops-redis
    env_file:
      - ./database/redis/.env
    ports:
      - "${REDIS_PORT:?REDIS_PORT is required}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # $$ -- mismo motivo que en postgres arriba.
      test: ["CMD-SHELL", "redis-cli --user $$REDIS_USER --pass $$REDIS_PASSWORD --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  n8n_data:

